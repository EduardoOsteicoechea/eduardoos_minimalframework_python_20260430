name: Deploy Backend to Amazon Linux

on:
  push:
    branches:
      - main # Or whichever branch you use for production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "." 
          target: "/var/www/eduardoos.com"
          rm: false 
          # Excludes local virtual environments, pycache, and git folders
          exclude: ".git/,__pycache__/,*.pyc,venv/,.venv/"

      - name: Install Dependencies and Restart Systemd Service
        uses: appleboy/ssh-action@v1.0.3 
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Navigate to the application directory
            cd /var/www/eduardoos.com
            
            # (Optional but recommended): Activate your virtual environment here if you use one on the server
            # source venv/bin/activate
            
            # 2. Install Python dependencies
            pip3 install -r requirements.txt
            
            # 3. Restart the systemd service
            sudo systemctl restart eduardoos-api